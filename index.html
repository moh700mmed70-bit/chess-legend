<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Legend — الاحتراف في الشطرنج</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>Chess Legend</h1>
    <p class="subtitle">حلل كالمحترفين &bull; تدرب كالأساتذة</p>
  </header>

  <section class="login-panel" id="loginPanel">
    <h2>أدخل حسابك لبدء التحليل</h2>
    <div class="input-group">
      <input type="text" class="username-input" id="usernameInput" placeholder="اسم المستخدم على Chess.com" />
      <button class="btn" id="fetchBtn">تحليل المباريات</button>
    </div>
    <div class="inline-error hidden" id="inputError"></div>
  </section>

  <div class="status-bar hidden" id="statusBar">
    <span class="spinner"></span>
    <span id="statusText">جاري التحميل...</span>
  </div>

  <main class="dashboard hidden" id="mainDashboard">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="analysis">التحليل المباشر</button>
      <button class="tab-btn" data-tab="openings">مدرب الافتتاحيات</button>
      <button class="tab-btn" data-tab="endgames">النهايات</button>
    </nav>

    <div class="tab-content">
      <!-- Analysis Tab -->
      <section id="analysisTab" class="tab-pane active">
        <div class="analysis-layout">
          <div style="display: flex; gap: 10px;">
            <div class="eval-bar-container">
              <div class="eval-bar-fill" id="evalBarFill" style="height: 50%;"></div>
              <div class="eval-bar-text" id="evalBarText">0.0</div>
            </div>
            <div class="board-container">
              <div class="board" id="mainBoard"></div>
              <div class="board-controls" style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
                <button class="icon-btn" id="firstMove">|&laquo;</button>
                <button class="icon-btn" id="prevMove">&laquo;</button>
                <button class="icon-btn" id="nextMove">&raquo;</button>
                <button class="icon-btn" id="lastMove">&raquo;|</button>
                <button class="icon-btn" id="flipBoard">&#8644;</button>
              </div>
            </div>
          </div>
          
          <div class="sidebar">
            <div class="panel" style="flex: 1;">
              <h3>قائمة المباريات</h3>
              <div class="scroll-area" id="gameList"></div>
            </div>
            <div class="panel" style="flex: 2;">
              <h3>تحليل النقلات</h3>
              <div class="scroll-area" id="moveHistory"></div>
              <div id="engineFeedback"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Openings Tab -->
      <section id="openingsTab" class="tab-pane">
        <div class="feature-grid" id="openingsGrid"></div>
      </section>

      <!-- Endgames Tab -->
      <section id="endgamesTab" class="tab-pane">
        <div class="feature-grid" id="endgamesGrid"></div>
      </section>
    </div>
  </main>

  <footer style="text-align: center; margin-top: 40px; color: var(--text-dim); font-size: 0.8rem;">
    &copy; 2026 Chess Legend &bull; جميع الحقوق محفوظة
  </footer>
</div>

<script src="main.js"></script>
</body>
</html>

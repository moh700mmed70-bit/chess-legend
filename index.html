<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Legend v5.0 — الاحتراف الحقيقي</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>Chess Legend</h1>
    <p class="subtitle">منصة التحليل والتدريب الذكية &bull; Stockfish 16</p>
  </header>

  <!-- Login Panel -->
  <section class="login-panel" id="loginPanel">
    <h2>أدخل حسابك لبدء التحليل الاحترافي</h2>
    <div class="input-group">
      <input type="text" class="username-input" id="usernameInput" placeholder="اسم المستخدم على Chess.com" />
      <button class="btn" id="fetchBtn">تحليل المباريات</button>
    </div>
    <div id="statusBar" class="hidden" style="margin-top: 15px;">
      <span class="spinner"></span>
      <span id="statusText" style="color: var(--accent); font-weight: bold;">جاري التحميل...</span>
    </div>
  </section>

  <!-- Main Dashboard -->
  <main class="dashboard hidden" id="mainDashboard">
    <nav class="tabs-nav">
      <button class="tab-btn active" data-tab="analysis">تحليل المباريات</button>
      <button class="tab-btn" data-tab="openings">مدرب الافتتاحيات</button>
      <button class="tab-btn" data-tab="puzzles">الألغاز التكتيكية</button>
      <button class="tab-btn" data-tab="endgames">إتقان النهايات</button>
    </nav>

    <div class="tab-content">
      <!-- Section: Analysis -->
      <section id="analysisTab" class="tab-pane active">
        <div class="main-layout">
          <div class="board-section">
            <div class="eval-bar">
              <div class="eval-fill" id="evalFill" style="height: 50%;"></div>
              <div class="eval-text" id="evalText">0.0</div>
            </div>
            <div class="board-container">
              <div class="board" id="mainBoard"></div>
              <div class="board-controls" style="display: flex; justify-content: center; gap: 10px; margin-top: 15px;">
                <button class="btn btn-secondary" id="firstMove">|&laquo;</button>
                <button class="btn btn-secondary" id="prevMove">&laquo;</button>
                <button class="btn btn-secondary" id="nextMove">&raquo;</button>
                <button class="btn btn-secondary" id="lastMove">&raquo;|</button>
                <button class="btn btn-secondary" id="flipBoard">&#8644;</button>
              </div>
              <div id="engineFeedback"></div>
            </div>
          </div>
          
          <div class="sidebar">
            <div class="panel" style="flex: 1;">
              <h3>قائمة المباريات</h3>
              <div class="scroll-area" id="gameList"></div>
            </div>
            <div class="panel" style="flex: 2;">
              <h3>تحليل النقلات</h3>
              <div class="scroll-area" id="moveHistory"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Section: Openings -->
      <section id="openingsTab" class="tab-pane">
        <div class="feature-grid" id="openingsGrid"></div>
      </section>

      <!-- Section: Puzzles -->
      <section id="puzzlesTab" class="tab-pane">
        <div class="feature-grid" id="puzzlesGrid"></div>
      </section>

      <!-- Section: Endgames -->
      <section id="endgamesTab" class="tab-pane">
        <div class="feature-grid" id="endgamesGrid"></div>
      </section>
    </div>
  </main>

  <footer style="text-align: center; margin-top: 50px; color: var(--text-dim); font-size: 0.8rem;">
    &copy; 2026 Chess Legend &bull; منصة التحليل والتدريب الاحترافية
  </footer>
</div>

<script src="main.js"></script>
</body>
</html>

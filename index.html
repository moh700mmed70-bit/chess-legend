<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Legend v6.0 — الدقة المتناهية</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>Chess Legend</h1>
    <p class="subtitle">تحليل احترافي &bull; تدريب ذكي &bull; دقة Stockfish</p>
  </header>

  <!-- Login Section -->
  <section id="loginPanel" class="login-panel">
    <h2>ابدأ رحلتك الاحترافية</h2>
    <div class="input-group">
      <input type="text" id="usernameInput" class="username-input" placeholder="اسم المستخدم على Chess.com" />
      <button id="fetchBtn" class="btn">تحليل المباريات</button>
    </div>
    <div id="statusBar" class="hidden" style="margin-top: 15px; color: var(--accent);">
      <span id="statusText">جاري التحميل...</span>
    </div>
  </section>

  <!-- Main Dashboard -->
  <main id="mainDashboard" class="dashboard hidden">
    <nav class="tabs-nav">
      <button class="tab-btn active" data-tab="analysis">التحليل والمراجعة</button>
      <button class="tab-btn" data-tab="openings">مدرب الافتتاحيات</button>
      <button class="tab-btn" data-tab="puzzles">الألغاز التكتيكية</button>
      <button class="tab-btn" data-tab="endgames">إتقان النهايات</button>
    </nav>

    <div class="main-layout">
      <!-- Left Side: Board & Eval -->
      <div class="board-section">
        <div class="eval-bar">
          <div id="evalFill" class="eval-fill" style="height: 50%;"></div>
          <div id="evalText" class="eval-text">0.0</div>
        </div>
        <div class="board-container">
          <div id="mainBoard" class="board"></div>
          <div class="board-controls">
            <button class="btn btn-secondary" id="firstMove">|&laquo;</button>
            <button class="btn btn-secondary" id="prevMove">&laquo;</button>
            <button class="btn btn-secondary" id="nextMove">&raquo;</button>
            <button class="btn btn-secondary" id="lastMove">&raquo;|</button>
            <button class="btn btn-secondary" id="flipBoard">&#8644;</button>
          </div>
          <div id="feedbackArea" class="feedback-container"></div>
        </div>
      </div>

      <!-- Right Side: Content Panels -->
      <div class="sidebar">
        <!-- Analysis Panel (Only visible in Analysis Tab) -->
        <div id="analysisPanel" class="tab-content-panel active">
          <div class="panel">
            <h3>المباريات الأخيرة</h3>
            <div id="gameList" class="scroll-area"></div>
          </div>
          <div class="panel" style="margin-top: 15px;">
            <h3>سجل النقلات والتحليل</h3>
            <div id="moveHistory" class="scroll-area"></div>
          </div>
        </div>

        <!-- Training Panels (Visible in their respective tabs) -->
        <div id="openingsPanel" class="tab-content-panel">
          <div class="panel">
            <h3>اختر افتتاحية للتدريب</h3>
            <div id="openingsList" class="scroll-area"></div>
          </div>
        </div>

        <div id="puzzlesPanel" class="tab-content-panel">
          <div class="panel">
            <h3>الألغاز التكتيكية</h3>
            <div id="puzzlesList" class="scroll-area"></div>
          </div>
        </div>

        <div id="endgamesPanel" class="tab-content-panel">
          <div class="panel">
            <h3>مواقف النهايات</h3>
            <div id="endgamesList" class="scroll-area"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer style="text-align: center; margin-top: 40px; color: var(--text-dim); font-size: 0.8rem;">
    &copy; 2026 Chess Legend &bull; تم التطوير بأعلى معايير الدقة
  </footer>
</div>

<script src="main.js"></script>
</body>
</html>

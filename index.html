<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Legend — Diamond Review</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>Chess Legend <span class="badge-diamond">DIAMOND</span></h1>
    <p class="subtitle">مراجعة المباريات بالذكاء الاصطناعي &bull; Stockfish 16</p>
  </header>

  <!-- Login Section -->
  <section id="loginPanel" class="login-panel">
    <h2>ابدأ مراجعة مبارياتك باحترافية</h2>
    <div class="input-group">
      <input type="text" id="usernameInput" class="username-input" placeholder="اسم المستخدم على Chess.com" />
      <button id="fetchBtn" class="btn">ابدأ المراجعة</button>
    </div>
    <div id="statusBar" class="hidden" style="margin-top: 15px; color: var(--accent);">
      <span id="statusText">جاري جلب البيانات...</span>
    </div>
  </section>

  <!-- Main Dashboard -->
  <main id="mainDashboard" class="dashboard hidden">
    <div class="main-layout">
      <!-- Board Section -->
      <div class="board-section">
        <div class="eval-bar">
          <div id="evalFill" class="eval-fill" style="height: 50%;"></div>
          <div id="evalText" class="eval-text">0.0</div>
        </div>
        <div class="board-container">
          <div id="mainBoard" class="board"></div>
          <div class="board-controls">
            <button class="btn btn-secondary" id="firstMove">|&laquo;</button>
            <button class="btn btn-secondary" id="prevMove">&laquo;</button>
            <button class="btn btn-secondary" id="nextMove">&raquo;</button>
            <button class="btn btn-secondary" id="lastMove">&raquo;|</button>
            <button class="btn btn-secondary" id="flipBoard">&#8644;</button>
          </div>
        </div>
      </div>

      <!-- Analysis Sidebar -->
      <div class="sidebar">
        <!-- Coach Explanation (Diamond Feature) -->
        <div class="panel coach-panel">
          <h3><span class="icon">💎</span> شرح المدرب</h3>
          <div id="coachExplanation" class="coach-text">اختر نقلة لبدء التحليل العميق...</div>
        </div>

        <!-- Game Selector -->
        <div class="panel">
          <h3>المباريات الأخيرة</h3>
          <div id="gameList" class="scroll-area" style="max-height: 200px;"></div>
        </div>

        <!-- Move History -->
        <div class="panel">
          <h3>سجل النقلات</h3>
          <div id="moveHistory" class="scroll-area" style="max-height: 250px;"></div>
        </div>
      </div>
    </div>
  </main>

  <footer style="text-align: center; margin-top: 40px; color: var(--text-dim); font-size: 0.8rem;">
    &copy; 2026 Chess Legend &bull; تجربة مراجعة ماسية متكاملة
  </footer>
</div>

<script src="main.js"></script>
</body>
</html>
